server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # The launch document is framed by operators; frame-ancestors is set per operator by the
  # platform in production (doc 11 §6). Development allows any http(s) parent.
  location = /launch { try_files /launch.html /launch/index.html =404; add_header Content-Security-Policy "frame-ancestors http: https:" always; add_header Referrer-Policy "no-referrer" always; }
  location / { try_files $uri $uri.html $uri/ =404; add_header X-Content-Type-Options "nosniff" always; }
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
