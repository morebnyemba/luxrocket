[project]
name = "luxrocket-backend"
version = "0.1.0"
description = "LUX ROCKET platform backend (Django)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49,<51",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.9,<3",
    "uvicorn>=0.34,<1",
    "webauthn>=3.0.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "hypothesis>=6.100",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running statistical tests (nightly)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["luxrocket/*/migrations/0001_initial.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["S101", "RUF012"]  # RUF012: Django Meta/Migration class attributes are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
files = [
    "luxrocket/core",
    "luxrocket/wallet/seamless.py",
    "luxrocket/wallet/simulator.py",
    "luxrocket/wallet/conformance.py",
    "luxrocket/operators/webhooks.py",
    "luxrocket/wallet/reconciliation.py",
    "luxrocket/portal",
    "luxrocket/console",
    "luxrocket/gaming/fairness.py",
]

[tool.django-stubs]
django_settings_module = "config.settings_test"
