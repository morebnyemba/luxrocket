# Local stack. `make up` starts Postgres; `make stack` builds and runs everything in sandbox
# mode (virtual credits). Every credential comes from ../../.demo/stack.env, generated with
# random values by `make stack` and git-ignored — none are written in this file.
name: luxrocket

x-backend: &backend
  build: { context: ../.., dockerfile: backend/Dockerfile }
  env_file: ../../.demo/stack.env
  environment:
    DJANGO_DEBUG: "1"                     # sandbox/dev stack only; production sets 0
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
    POSTGRES_HOST: postgres
    GAME_ORIGIN: http://localhost:3000
    PLAY_BASE_URL: http://localhost:3000
    REALTIME_INTERNAL_URL: http://realtime:4000

services:
  postgres:
    image: postgres:16-alpine
    env_file: ../../.demo/stack.env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    profiles: ["infra"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    env_file: ../../.demo/stack.env
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    profiles: ["infra"]

  # One-shot: Django migrations and the demo operator (key written to ./.demo).
  migrate:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_demo --key-out /demo/operator.key --origin http://localhost:8000"]
    volumes: ["../../.demo:/demo"]
    # Local tooling only: writes the demo operator key into the host-mounted ./.demo directory.
    user: root
    depends_on: { postgres: { condition: service_healthy } }
    profiles: ["app"]

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    profiles: ["app"]

  workers:
    <<: *backend
    command: ["python", "manage.py", "run_workers"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    profiles: ["app"]

  realtime:
    build: { context: ../../realtime }
    env_file: ../../.demo/stack.env
    environment:
      POSTGRES_HOST: postgres
      SEED_CHAIN_LENGTH: "100000"
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4000"
      PLATFORM_INTERNAL_URL: http://api:8000
      GAME_ORIGINS: http://localhost:3000
    command: ["sh", "-c", "/app/bin/lux_rt eval 'LuxRt.Release.migrate()' && exec /app/bin/lux_rt start"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    profiles: ["app"]

  game:
    build:
      context: ../..
      dockerfile: apps/game/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_RT_URL: ws://localhost:4000/socket
    ports: ["127.0.0.1:3000:8080"]
    profiles: ["app"]

volumes:
  pgdata:
